name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: format + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # rust-embed reads frontend/dist at compile time, so the console must be
      # built before any cargo command.
      - name: Build the console
        run: |
          cd frontend
          npm ci --no-audit --no-fund
          npm run build
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings

  test:
    name: tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the console
        run: |
          cd frontend
          npm ci --no-audit --no-fund
          npm run build
      # Includes tests/s3_http.rs: the real router on a loopback port, driven
      # by an independent SigV4 signer (no shell or SDK required).
      - name: Tests
        run: cargo test --locked
      - name: Build the binary
        run: cargo build --locked

  # Compatibility with the official AWS CLI, which signs with its own SDK and
  # streams bodies as `aws-chunked`. This is what caught the multipart framing
  # and concurrent-part bugs, so it stays in CI.
  awscli:
    name: AWS CLI compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install AWS CLI
        run: |
          curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip
          unzip -q /tmp/awscliv2.zip -d /tmp
          sudo /tmp/aws/install
          aws --version
      - name: Build
        run: |
          cd frontend && npm ci --no-audit --no-fund && npm run build && cd ..
          cargo build --release --locked
      - name: Provision an access key
        run: |
          ./target/release/hejiu45-oss \
            --data-dir "$RUNNER_TEMP/data" \
            --init-access-key ci-awscli > "$RUNNER_TEMP/provision.log" 2>&1
          echo "AWS_ACCESS_KEY_ID=$(grep '^access_key_id:' "$RUNNER_TEMP/provision.log" | awk '{print $2}')" >> "$GITHUB_ENV"
          echo "AWS_SECRET_ACCESS_KEY=$(grep '^secret_access_key:' "$RUNNER_TEMP/provision.log" | awk '{print $2}')" >> "$GITHUB_ENV"
      - name: Start the server
        run: |
          nohup ./target/release/hejiu45-oss \
            --data-dir "$RUNNER_TEMP/data" \
            --listen 127.0.0.1:9000 \
            --allow-insecure \
            --public-url http://127.0.0.1:9000 \
            > "$RUNNER_TEMP/server.log" 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9000/healthz; then exit 0; fi
            sleep 0.5
          done
          cat "$RUNNER_TEMP/server.log" >&2
          exit 1
      - name: Run the AWS CLI suite
        shell: pwsh
        run: ./scripts/e2e-awscli.ps1 -Endpoint http://127.0.0.1:9000/s3

