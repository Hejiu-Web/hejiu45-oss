name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: format + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # rust-embed reads frontend/dist at compile time, so the console must be
      # built before any cargo command.
      - name: Build the console
        run: |
          cd frontend
          npm ci --no-audit --no-fund
          npm run build
      # A stray BOM silently breaks Cargo.toml parsing for some tooling.
      - name: No byte-order marks
        run: bash scripts/check-no-bom.sh
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings

  test:
    name: tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the console
        run: |
          cd frontend
          npm ci --no-audit --no-fund
          npm run build
      # Includes tests/s3_http.rs: the real router on a loopback port, driven by
      # an independent SigV4 signer (no shell or SDK required).
      - name: Tests
        run: cargo test --locked
      - name: Report the failing test, if any
        if: failure()
        shell: bash
        run: |
          echo "=== rerunning each target separately to isolate the failure ==="
          cargo test --locked --lib -- --nocapture 2>&1 | tail -n 40 || true
          echo "=== integration ==="
          cargo test --locked --test s3_http -- --nocapture 2>&1 | tail -n 60 || true
      - name: Build the binary
        run: cargo build --locked

  # Compatibility with the official AWS CLI, which signs with its own SDK and
  # streams bodies as `aws-chunked`. This is what caught the multipart framing
  # and concurrent-part bugs, so it stays in CI.
  awscli:
    name: AWS CLI compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # v2 installer from the official CDN, with retries: transient CDN errors
      # were what broke the first CI run.
      - name: Install AWS CLI (v2)
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 2 \
            "https://awscli.amazonaws.com/awscli-exe-linux-$(uname -m).zip" -o awscliv2.zip
          unzip -q awscliv2.zip
          sudo ./aws/install --update
          aws --version
      - name: Build
        run: |
          cd frontend && npm ci --no-audit --no-fund && npm run build && cd ..
          cargo build --release --locked
      - name: Provision an access key
        run: |
          ./target/release/hejiu45-oss \
            --data-dir "$RUNNER_TEMP/data" \
            --init-access-key ci-awscli > "$RUNNER_TEMP/provision.log" 2>&1
          echo "AWS_ACCESS_KEY_ID=$(grep '^access_key_id:' "$RUNNER_TEMP/provision.log" | awk '{print $2}')" >> "$GITHUB_ENV"
          echo "AWS_SECRET_ACCESS_KEY=$(grep '^secret_access_key:' "$RUNNER_TEMP/provision.log" | awk '{print $2}')" >> "$GITHUB_ENV"
      - name: Start the server
        run: |
          nohup ./target/release/hejiu45-oss \
            --data-dir "$RUNNER_TEMP/data" \
            --listen 127.0.0.1:9000 \
            --allow-insecure \
            --public-url http://127.0.0.1:9000 \
            > "$RUNNER_TEMP/server.log" 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9000/healthz; then exit 0; fi
            sleep 0.5
          done
          cat "$RUNNER_TEMP/server.log" >&2
          exit 1
      - name: Check the toolchain the suite depends on
        continue-on-error: true
        shell: pwsh
        run: |
          $PSVersionTable | Format-Table | Out-String | Write-Host
          (Get-Command aws -All -ErrorAction SilentlyContinue) | Format-List Name, CommandType, Source | Out-String | Write-Host
          aws --version
          "AK set: $([bool]$env:AWS_ACCESS_KEY_ID)  SK set: $([bool]$env:AWS_SECRET_ACCESS_KEY)"
          curl -fsS http://127.0.0.1:9000/healthz
      - name: Lint the suite for Windows-only binaries
        run: |
          # PowerShell's `curl` alias hides curl.exe on Windows, but scripts that
          # also run on Linux must invoke the real `curl`. Match only command
          # invocations, so explanatory comments do not trip the check.
          if grep -nE '&\s*"?curl\.exe|^\s*curl\.exe\s' scripts/e2e-awscli.ps1; then
            echo "::error file=scripts/e2e-awscli.ps1::invokes curl.exe, which does not exist on Linux"
            exit 1
          fi
          echo "no Windows-only binaries invoked"
      - name: Run the AWS CLI suite
        shell: pwsh
        run: |
          ./scripts/e2e-awscli.ps1 -Endpoint http://127.0.0.1:9000/s3
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error title=E2E suite::the AWS CLI suite reported failures (exit $LASTEXITCODE)"
            exit 1
          }



