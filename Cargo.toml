[package]
name = "hejiu45-oss"
version = "0.2.1"
edition = "2024"
rust-version = "1.85"
description = "A single-binary, S3-compatible object storage server with an embedded admin console"
license = "MIT"
repository = "https://github.com/Hejiu-Web/hejiu45-oss"
homepage = "https://github.com/Hejiu-Web/hejiu45-oss"
documentation = "https://github.com/Hejiu-Web/hejiu45-oss#readme"
keywords = ["s3", "object-storage", "oss", "minio", "axum"]
categories = ["web-programming::http-server"]
readme = "README.md"

[[bin]]
name = "hejiu45-oss"
path = "src/main.rs"

[dependencies]
# web
axum = { version = "0.8", features = ["http1", "http2", "query", "macros"] }
axum-extra = { version = "0.10", features = ["cookie"] }
axum-server = { version = "0.8", features = ["tls-rustls"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "limit"] }
tower-sessions = "0.15"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "io-util", "signal", "time", "sync"] }
tokio-util = { version = "0.7", features = ["io"] }
http = "1"
http-body-util = "0.1"
bytes = "1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["server", "http1", "tokio"] }

# storage / meta
redb = "4"
rust-embed = { version = "8", features = ["include-exclude"] }
mime_guess = "2"
async-trait = "0.1"
futures-util = "0.3"
percent-encoding = "2"

# crypto / auth
hmac = "0.13"
sha2 = "0.11"
hex = "0.4"
subtle = "2"
getrandom = "0.4"
salting = "2"
md-5 = "0.10"
aws-lc-rs = "1"

# tls
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12"] }
rustls-pemfile = "2"

# serde / config / util
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_html_form = "0.4"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
uuid = { version = "1", features = ["v4", "fast-rng"] }
thiserror = "2"
anyhow = "1"
parking_lot = "0.12"
# Advisory single-instance lock (flock / LockFileEx) without unsafe code.
fs2 = "0.4"

# Dev-only helper binary (`cargo run --bin gen-cert`).
rcgen = { version = "0.14", optional = true }

[features]
default = []
dev-tools = ["dep:rcgen"]

[[bin]]
name = "gen-cert"
path = "src/bin/gen-cert.rs"
required-features = ["dev-tools"]


[build-dependencies]
walkdir = "2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2







