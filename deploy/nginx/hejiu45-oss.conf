# hejiu45-oss — Nginx reverse-proxy configuration
#
# This file terminates TLS and forwards everything to the single
# hejiu45-oss binary. Use it when you already run Nginx (or use it to get a
# Let's Encrypt certificate via certbot).
#
#   Ubuntu/Debian:  /etc/nginx/sites-available/hejiu45-oss.conf
#   RHEL/CentOS:    /etc/nginx/conf.d/hejiu45-oss.conf
#
# Then start the server in reverse-proxy mode so it trusts the proxy's
# X-Forwarded-Proto for the Secure cookie flag:
#
#   hejiu45-oss --data-dir /var/lib/hejiu45-oss \
#     --listen 127.0.0.1:9000 --tls reverse-proxy
#
# Obtain the certificate first (certbot will also offer to write this file for
# you; accept and merge the `ssl_*` lines below):
#
#   sudo certbot --nginx -d oss.example.com --redirect
#
# If you use certbot, it manages `ssl_certificate` automatically; the explicit
# paths below are for manually issued certificates.

# ---------------------------------------------------------------------------
# Upstream: the single binary
# ---------------------------------------------------------------------------
upstream hejiu45_oss {
    server 127.0.0.1:9000;
    keepalive 64;
}

# ---------------------------------------------------------------------------
# HTTP → HTTPS redirect (keep the ACME challenge reachable over HTTP)
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name oss.example.com;

    # certbot --webroot renewals
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# HTTPS
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name oss.example.com;

    # --- certificates (replace with certbot's paths if managed) -------------
    ssl_certificate     /etc/letsencrypt/live/oss.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/oss.example.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/oss.example.com/chain.pem;

    # Modern, broadly compatible TLS. TLS 1.0/1.1 are deliberately absent:
    # SigV4 and the Secure session cookie both assume a current transport.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:HJ45_SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # --- security headers ---------------------------------------------------
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- request body limits ------------------------------------------------
    # Object uploads stream through the proxy; 1 GiB fits multipart parts and
    # most single PUTs. Raise it (and `--max-object-bytes` on the server) for
    # larger objects, or use multipart uploads.
    client_max_body_size 1g;
    client_body_buffer_size 256k;
    client_body_timeout 300s;
    send_timeout 300s;

    # Never let a slow client pin a worker forever during a download.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # Do not buffer object bodies: proxying them costs RAM and breaks progress
    # reporting for large uploads.
    proxy_request_buffering off;
    proxy_buffering off;

    # --- proxy headers ------------------------------------------------------
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    # REQUIRED: the server marks the session cookie `Secure` only when it sees
    # https here (see `--tls reverse-proxy`).
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Port  $server_port;
    # SigV4 signs the Host header; keep the hop-by-hop connection header sane.
    proxy_set_header Connection        "";

    # --- console + management API ------------------------------------------
    location / {
        proxy_pass http://hejiu45_oss;
    }

    # --- S3 data plane ------------------------------------------------------
    # Optional: serve S3 on its own hostname (`s3.oss.example.com`) to keep the
    # console and object traffic in separate browser/SDK contexts. Point that
    # server_name here and set `--s3-prefix ""` on the binary.
    #
    # With the default `--s3-prefix /s3`, the generic `location /` above is
    # enough; this block just documents the tuning for large transfers.
    location /s3/ {
        proxy_pass http://hejiu45_oss;

        # Large objects: stream both directions.
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_max_temp_file_size 0;

        # Do not let Nginx transform or gzip object bodies.
        gzip off;
        chunked_transfer_encoding on;
    }

    # Static console assets are content-hashed by Vite; let browsers keep them.
    location /assets/ {
        proxy_pass http://hejiu45_oss;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Liveness probe for monitoring; no access log noise.
    location = /healthz {
        proxy_pass http://hejiu45_oss;
        access_log off;
    }

    # Access log: keep default combined unless you want the client IP promoted.
}
